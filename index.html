<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <h1>Passenger Counter</h1>
            <h2  id="count-el">0</h2>
            <button class="btn" id="increment-btn" onclick="increment()">INCREMENT</button>
            <button class="btn" id="decrement-btn" onclick="decrement()">DECREMENT</button>
            <button class="btn" id="save-btn" onclick="save()">SAVE</button>
            <button class="btn" id="clear-btn">CLEAR</button>
            <div id="data">
            <p id="save-el">Previous entries: </p>
            <p id="total-el">Total Count: </p>
            </div>
        </div>
        <script src="index.js">
    
        </script>
    </body>
</html>
